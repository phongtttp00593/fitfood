<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Gán khách hàng | FITFOOD</title><link rel="stylesheet" th:href="@{/css/fitfood-modern.css}" /><link rel="stylesheet" th:href="@{/css/admin-theme.css}" /><style>
.assign-page{max-width:1100px;margin:auto}.assign-page h1{color:#2b180f}.assign-card{background:#fff;border:1px solid #ead8bd;border-radius:16px;padding:22px;margin:18px 0}.assign-table{width:100%;border-collapse:collapse}.assign-table th,.assign-table td{text-align:left;padding:13px;border-bottom:1px solid #eee5d8}.assign-table th{background:#f7efde;color:#776453}.assign-button{border:0;border-radius:8px;background:#a53021;color:white;padding:9px 14px;font-weight:700;cursor:pointer}.assigned{color:#267443;font-weight:700}.back-link{display:inline-block;margin:12px 0;color:#8f321e;text-decoration:none}.success{padding:12px 16px;border-radius:10px;background:#edf8ef;color:#22623d}
</style></head>
<body class="admin-body"><div class="adm-layout"><aside class="adm-sidebar" th:replace="~{fragments/admin-sidebar :: sidebar('meal-plans')}"></aside><div class="adm-main"><header class="adm-top"><div class="admin-breadcrumb">FITFOOD <span>/</span> <a th:href="@{/admin/meal-plans}">Gói ăn</a> <span>/</span> Gán khách hàng</div></header><main class="adm-content assign-page"><a class="back-link" th:href="@{/admin/meal-plans}">← Quay lại gói ăn</a><span class="admin-eyebrow">QUẢN LÝ GÓI ĂN</span><h1>Gán khách hàng vào gói</h1><div class="assign-card"><h2 th:text="${mealPlan.name}">Gói ăn</h2><p th:text="${mealPlan.numberOfDays} + ' ngày · ' + ${#numbers.formatDecimal(mealPlan.price,0,'COMMA',0,'POINT')} + 'đ'">7 ngày</p><div class="success" th:if="${success}" th:text="${success}"></div><table class="assign-table"><thead><tr><th>KHÁCH HÀNG</th><th>EMAIL</th><th>TRẠNG THÁI GÓI</th><th>THAO TÁC</th></tr></thead><tbody><tr th:each="customer : ${customerOptions}"><td th:text="${customer.name}">Tên khách</td><td th:text="${customer.email}">email</td><td><span class="assigned" th:if="${customer.alreadyAssigned}">Đang dùng gói này</span><span th:unless="${customer.alreadyAssigned}">Chưa gán</span></td><td><form method="post" th:action="@{/admin/customers/{id}/meal-plan(id=${customer.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" name="mealPlanId" th:value="${mealPlan.id}"/><input type="hidden" name="returnTo" th:value="@{/admin/meal-plans/{id}/customers(id=${mealPlan.id})}"/><button class="assign-button" type="submit" th:text="${customer.alreadyAssigned ? 'Cập nhật gói' : 'Gán gói này'}">Gán gói này</button></form></td></tr><tr th:if="${#lists.isEmpty(customerOptions)}"><td colspan="4">Chưa có khách hàng đang hoạt động.</td></tr></tbody></table></div></main></div></div></body></html>
