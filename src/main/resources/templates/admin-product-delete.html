<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xóa món ăn | FITFOOD Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" th:href="@{/css/admin-product-delete.css}" />
</head>
<body>

<div class="container">

    <div th:if="${errorMessage}"
         class="message error"
         th:text="${errorMessage}"></div>

    <div class="message error">
        Xác nhận xóa món ăn khỏi hệ thống. Hành động này không thể hoàn tác.
    </div>

    <div class="info-box">
        <div class="thumb-wrap">
            <img th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                 th:src="${product.imageUrl}"
                 alt="Ảnh món ăn" />
            <div th:unless="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                 class="no-img">
                No Image
            </div>
        </div>

        <div class="info-content">
            <h3 th:text="${product.name}">Tên sản phẩm</h3>
            <p><strong>Mã món:</strong> #<span th:text="${product.id}"></span></p>
            <p><strong>Danh mục:</strong> <span th:text="${categoryName != null ? categoryName : 'Chưa phân loại'}"></span></p>
            <p><strong>Giá bán:</strong> <span th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'POINT') + ' VNĐ'}"></span></p>
            <p>
                <strong>Trạng thái:</strong>
                <span th:if="${product.active}" class="status-badge active">Đang mở bán</span>
                <span th:unless="${product.active}" class="status-badge inactive">Ngưng bán</span>
            </p>
        </div>
    </div>

    <form th:action="@{/admin/products/delete/{id}(id=${product.id})}"
          method="post">
        <div class="actions">
            <a class="btn cancel"
               th:href="@{/admin/products}">
                Hủy bỏ
            </a>

            <button type="submit" class="btn delete">
                Xác nhận xóa
            </button>
        </div>
    </form>

</div>

</body>
</html>
