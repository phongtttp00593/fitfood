<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Đơn - FitFood</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/fitfood-modern.css}">
    <style>
        .menu-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }
        .product-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
        }
        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            background: #f5f5f5;
            margin-bottom: 12px;
        }
        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        .product-desc {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 12px;
            flex-grow: 1;
        }
        .product-price {
            font-size: 1.15rem;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 12px;
        }
        .btn-add-modal {
            background-color: #27ae60;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-add-modal:hover {
            background-color: #219150;
        }

        /* Modal popup */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-content-box {
            background: #fff;
            width: 380px;
            max-width: 90%;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            text-align: center;
        }
        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 18px 0;
        }
        .qty-btn {
            width: 36px;
            height: 36px;
            font-size: 20px;
            font-weight: bold;
            background: #f1f2f6;
            border: 1px solid #ced6e0;
            border-radius: 6px;
            cursor: pointer;
        }
        .qty-btn:hover {
            background: #dfe4ea;
        }
        .qty-input {
            width: 60px;
            height: 36px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #ced6e0;
            border-radius: 6px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-close {
            background: #f1f2f6;
            border: 1px solid #ced6e0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-submit {
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-submit:hover {
            background: #219150;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header style="background: #2c3e50; color: #fff; padding: 15px 0;">
        <div style="max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; padding: 0 15px;">
            <a th:href="@{/}" style="color: #fff; text-decoration: none; font-size: 22px; font-weight: bold;">FitFood</a>
            <nav style="display: flex; gap: 20px; align-items: center;">
                <a th:href="@{/menu}" style="color: #fff; text-decoration: none;">Thực Đơn</a>
                <a th:href="@{/cart}" style="color: #fff; text-decoration: none; background: #e67e22; padding: 6px 14px; border-radius: 20px;">Giỏ hàng</a>
            </nav>
        </div>
    </header>

    <div class="menu-container">
        <h2>Danh Sách Thực Đơn</h2>

        <div class="product-grid">
            <div class="product-card" th:each="product : ${products}">
                <div>
                    <img class="product-img" 
                         th:src="${product.imageUrl != null ? product.imageUrl : '/images/chicken-bowl.jpg'}" 
                         th:alt="${product.name}" />
                    <div class="product-title" th:text="${product.name}">Tên Món Ăn</div>
                    <div class="product-desc" th:text="${product.description}">Mô tả món ăn dinh dưỡng...</div>
                </div>
                <div>
                    <div class="product-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>
                    <button type="button" class="btn-add-modal"
                            th:data-id="${product.id}"
                            th:data-name="${product.name}"
                            th:data-price="${product.price}"
                            onclick="openQuickAddModal(this)">
                        Thêm vào giỏ
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP THÊM VÀO GIỎ HÀNG -->
    <div id="quickAddModal" class="modal-overlay">
        <div class="modal-content-box">
            <h3 id="modalName" style="margin-bottom: 6px; color: #2c3e50;">Tên Món</h3>
            <p style="color: #7f8c8d; font-size: 14px;">Đơn giá: <strong id="modalUnitPriceDisplay">0</strong> đ</p>

            <form th:action="@{/cart/add}" method="post">
                <input type="hidden" name="productId" id="modalProductId" />

                <div class="qty-controls">
                    <button type="button" class="qty-btn" onclick="modifyQty(-1)">-</button>
                    <input type="number" id="modalQtyInput" name="quantity" class="qty-input" value="1" min="1" readonly />
                    <button type="button" class="qty-btn" onclick="modifyQty(1)">+</button>
                </div>

                <div style="font-size: 16px; margin: 12px 0;">
                    Tổng tiền: <strong id="modalTotalDisplay" style="color: #27ae60; font-size: 20px;">0</strong> <strong>đ</strong>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-close" onclick="closeQuickAddModal()">Hủy</button>
                    <button type="submit" class="btn-submit">Xác nhận thêm</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let selectedProductPrice = 0;

        function openQuickAddModal(button) {
            const id = button.getAttribute('data-id');
            const name = button.getAttribute('data-name');
            const price = parseFloat(button.getAttribute('data-price')) || 0;

            selectedProductPrice = price;
            document.getElementById('modalProductId').value = id;
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalUnitPriceDisplay').innerText = price.toLocaleString('vi-VN');
            document.getElementById('modalQtyInput').value = 1;

            calculateModalTotal();
            document.getElementById('quickAddModal').style.display = 'flex';
        }

        function closeQuickAddModal() {
            document.getElementById('quickAddModal').style.display = 'none';
        }

        function modifyQty(amount) {
            const qtyInput = document.getElementById('modalQtyInput');
            let current = parseInt(qtyInput.value) || 1;
            current += amount;
            if (current < 1) current = 1;
            qtyInput.value = current;
            calculateModalTotal();
        }

        function calculateModalTotal() {
            const qty = parseInt(document.getElementById('modalQtyInput').value) || 1;
            const total = selectedProductPrice * qty;
            document.getElementById('modalTotalDisplay').innerText = total.toLocaleString('vi-VN');
        }

        // Đóng modal khi bấm ra ngoài vùng hộp thoại
        window.onclick = function(event) {
            const modal = document.getElementById('quickAddModal');
            if (event.target === modal) {
                closeQuickAddModal();
            }
        };
    </script>
</body>
</html>
