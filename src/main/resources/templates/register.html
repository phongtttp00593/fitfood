<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Đăng ký | FITFOOD</title>
        <link rel="stylesheet" th:href="@{/css/fitfood-modern.css}" />
        <link rel="stylesheet" th:href="@{/css/fitfood-auth.css}" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin="anonymous"
            />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
            />
    </head>
    <body>
        <header class="site-header">
            <div class="nav-inner">
                <a th:href="@{/}" class="site-brand"
                   ><img th:src="@{/images/leaf.svg}" alt="" /><span>FITFOOD</span></a
                >
                <nav class="nav-menu">
                    <a th:href="@{/}">Trang chủ</a><a th:href="@{/menu}">Thực đơn</a
                    ><a th:href="@{/dang-nhap}">Đăng nhập</a>
                </nav>
            </div>
        </header>
        <main class="login-page">
            <div class="login-shell">
                <div class="login-form-side">
                    <a href="/" class="site-brand login-brand"
                       ><img src="/images/leaf.svg" alt="" /><span>FITFOOD</span></a
                    >
                    <div class="login-center">
                        <div class="section-kicker">THÀNH VIÊN MỚI</div>
                        <h1>Tạo tài khoản</h1>
                        <p>Đăng ký để sử dụng FITFOOD.</p>
                        <div
                            class="auth-alert error"
                            th:if="${error}"
                            th:text="${error}"
                            ></div>
                        <form th:action="@{/dang-ky}" method="post" class="auth-form">
                            <input
                                type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}"
                                />
                            <label class="label-field"
                                   >Họ và tên
                                <div class="form-field">
                                    <input
                                        name="fullName"
                                        th:value="${fullName}"
                                        type="text"
                                        placeholder="Nguyễn Văn A"
                                        required
                                        minlength="2"
                                        maxlength="120"
                                        autocomplete="name"
                                        /></div
                                ></label>
                            <label class="label-field"
                                   >Email
                                <div class="form-field">
                                    <input
                                        name="email"
                                        th:value="${email}"
                                        type="email"
                                        placeholder="ban@gmail.com"
                                        required
                                        maxlength="254"
                                        autocomplete="email"
                                        /></div
                                ></label>
                            <label class="label-field"
                                   >Mật khẩu
                                <div class="form-field">
                                    <input
                                        name="password"
                                        type="password"
                                        placeholder="Tối thiểu 8 ký tự"
                                        required
                                        minlength="8"
                                        maxlength="64"
                                        autocomplete="new-password"
                                        /></div
                                ></label>
                            <label class="label-field"
                                   >Nhập lại mật khẩu
                                <div class="form-field">
                                    <input
                                        name="confirmPassword"
                                        type="password"
                                        placeholder="Xác nhận mật khẩu"
                                        required
                                        minlength="8"
                                        maxlength="64"
                                        autocomplete="new-password"
                                        /></div
                                ></label>
                            <button class="btn btn-primary login-submit" type="submit">
                                Tạo tài khoản →
                            </button>
                        </form>
                        <div class="join-label">
                            Đã có tài khoản? <a th:href="@{/dang-nhap}">Đăng nhập</a>
                        </div>
                    </div>
                </div>
                <div class="login-photo-side">
                    <div class="login-glow"></div>
                    <img src="/images/welcome-green.jpg" alt="Thực phẩm healthy" />
                    <div class="login-quote">
                        <span>FITFOOD LIFESTYLE</span>
                        <h2>Ăn sạch.<br />Sống xanh.<br /><em>Mỗi ngày.</em></h2>
                        <p>Khởi đầu lối sống lành mạnh từ bữa ăn.</p>
                    </div>
                </div>
            </div>
        </main>
        <div class="auth-footer">© 2026 FITFOOD · Ăn ngon, sống khỏe</div>
    </body>
</html>
