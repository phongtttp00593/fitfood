<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đơn hàng của tôi | FITFOOD</title>
    <link rel="stylesheet" th:href="@{/css/fitfood-modern.css}" />
    <link rel="stylesheet" th:href="@{/css/fitfood-auth.css}" />
    <link rel="stylesheet" th:href="@{/css/fitfood-account.css}" />
    <link rel="stylesheet" th:href="@{/css/site-theme.css}" />
    <style>
      .mo-wrap { max-width: 860px; margin: 32px auto; padding: 0 16px; font-family: "Be Vietnam Pro", Arial, sans-serif; }
      .mo-card { background: #fff; border: 1px solid #d9ebe0; border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
      .mo-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
      .mo-meta { color: #5b7a6b; font-size: 13px; margin: 4px 0 12px; }
      .mo-steps { display: flex; gap: 6px; margin: 12px 0; }
      .mo-step { flex: 1; text-align: center; font-size: 12px; color: #8aa597; }
      .mo-step::before { content: ""; display: block; height: 6px; border-radius: 4px; background: #e3efe8; margin-bottom: 6px; }
      .mo-step.done { color: #087f5b; font-weight: 700; }
      .mo-step.done::before { background: #087f5b; }
      .mo-badge { padding: 4px 12px; border-radius: 20px; background: #eaf6ee; color: #087f5b; font-weight: 700; font-size: 12px; }
      .mo-badge.cancel { background: #fdecec; color: #c0392b; }
      .mo-cancel { border: 1px solid #c0392b; background: #fff; color: #c0392b; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
      .mo-cancel:hover { background: #fdecec; }
      .mo-flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
      .mo-flash.ok { background: #eaf6ee; color: #087f5b; }
      .mo-flash.err { background: #fdecec; color: #c0392b; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="nav-inner">
        <a th:href="@{/}" class="site-brand"
          ><img th:src="@{/images/leaf.svg}" alt="" /><span>FITFOOD</span></a
        >
        <nav class="nav-menu">
          <a th:href="@{/}">Trang chủ</a><a th:href="@{/menu}">Thực đơn</a
          ><a th:href="@{/cart}">Giỏ hàng</a>
        </nav>
        <div class="nav-right">
          <a class="fit-account-back" th:href="@{/tai-khoan}">← Tài khoản</a>
        </div>
      </div>
    </header>
    <main class="mo-wrap">
      <h1>Đơn hàng của tôi</h1>
      <div class="mo-flash ok" th:if="${success}" th:text="${success}"></div>
      <div class="mo-flash err" th:if="${error}" th:text="${error}"></div>
      <p th:if="${#lists.isEmpty(orders)}">Bạn chưa có đơn hàng nào.</p>
      <div class="mo-card" th:each="o : ${orders}">
        <div class="mo-head">
          <strong th:text="'Đơn #' + ${o.id}">Đơn #1</strong>
          <span class="mo-badge" th:classappend="${o.step == 0} ? 'cancel'" th:text="${o.status}">Chờ xác nhận</span>
        </div>
        <div class="mo-meta">
          <span th:if="${o.placedAt != null}" th:text="${#temporals.format(o.placedAt, 'dd/MM/yyyy HH:mm')}"></span>
          · <span th:text="${o.itemCount} + ' món'"></span>
          · <strong th:text="${#numbers.formatDecimal(o.total, 0, 'POINT', 0, 'COMMA')} + 'đ'"></strong>
        </div>
        <div class="mo-steps" th:unless="${o.step == 0}">
          <div class="mo-step" th:classappend="${o.step >= 1} ? 'done'">Chờ xác nhận</div>
          <div class="mo-step" th:classappend="${o.step >= 2} ? 'done'">Đang xử lý</div>
          <div class="mo-step" th:classappend="${o.step >= 3} ? 'done'">Đang giao</div>
          <div class="mo-step" th:classappend="${o.step >= 4} ? 'done'">Hoàn thành</div>
        </div>
        <div class="mo-meta" th:if="${o.deliveryStatus != null and o.step != 0}">
          Giao hàng: <strong th:text="${o.deliveryStatus}">Chờ giao</strong>
          <span th:if="${o.sentAt != null}" th:text="' · Gửi ' + ${#temporals.format(o.sentAt, 'dd/MM/yyyy HH:mm')}"></span>
          <span th:if="${o.deliveredAt != null}" th:text="' · Nhận ' + ${#temporals.format(o.deliveredAt, 'dd/MM/yyyy HH:mm')}"></span>
        </div>
        <form th:if="${o.cancellable}" method="post"
              th:action="@{/don-hang-cua-toi/{id}/huy(id=${o.id})}"
              onsubmit="return confirm('Bạn chắc chắn muốn hủy đơn này?');">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="mo-cancel">Hủy đơn hàng</button>
        </form>
      </div>
    </main>
  </body>
</html>
