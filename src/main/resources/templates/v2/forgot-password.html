<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{v2/fragments/layout :: head('Quên mật khẩu')}"></head>
<body>
<div th:replace="~{v2/fragments/layout :: header('login')}"></div>

<main id="main">
  <div class="auth-wrap">
    <div class="container auth-container">
      <div class="card pad stack auth-card">
        <span class="auth-seal" aria-hidden="true"></span>
        <p class="eyebrow">Khôi phục tài khoản</p>
        <h1>Quên mật khẩu?</h1>
        <p class="muted small">Nhập email đã đăng ký, chúng tôi sẽ gửi đường dẫn đặt lại mật khẩu có hiệu lực trong 15 phút.</p>
        <div class="msg error" th:if="${error}" th:text="${error}">Lỗi</div>
        <div class="msg ok" th:if="${notice}" th:text="${notice}">Đã gửi</div>
        <form class="stack" th:action="@{/quen-mat-khau}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" maxlength="254" required /></div>
          <button class="btn block" type="submit">Gửi liên kết đặt lại</button>
        </form>
        <p class="small"><a th:href="@{/dang-nhap}">← Quay lại đăng nhập</a></p>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{v2/fragments/layout :: footer}"></footer>
<th:block th:replace="~{v2/fragments/layout :: scripts}"></th:block>
</body>
</html>
