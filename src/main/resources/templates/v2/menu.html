<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{v2/fragments/layout :: head('Thực đơn')}"></head>
<body>

<div th:replace="~{v2/fragments/layout :: header('menu')}"></div>

<!-- TOAST THÔNG BÁO THÀNH CÔNG -->
<div id="toastSuccess" th:if="${successMessage}" 
     style="position: fixed; top: 25px; right: 25px; z-index: 100000; background: #27ae60; color: #fff; padding: 14px 22px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-weight: 600; display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease;">
    <span>✓</span>
    <span th:text="${successMessage}">Thêm món vào giỏ hàng thành công!</span>
</div>

<main id="main">
    <header class="page-hero">
        <div class="container">
            <nav class="breadcrumb" aria-label="Đường dẫn">
                <a th:href="@{/}">Trang chủ</a>
                <i>›</i>
                <span aria-current="page">Thực đơn</span>
            </nav>

            <p class="eyebrow">Nấu mới mỗi ngày</p>
            <h1>Thực đơn</h1>

            <p class="lead">
                Cơm healthy, salad và món cao cấp —
                nguyên liệu tươi, dinh dưỡng cân bằng.
            </p>
        </div>
    </header>

    <div class="container menu-layout" id="menuApp">

        <!-- DANH MỤC -->
        <aside class="menu-side" aria-label="Danh mục">
            <h2 class="side-title">Danh mục</h2>

            <div class="cat-list">
                <button class="tab on"
                        type="button"
                        data-filter="">
                    Tất cả
                </button>

                <button class="tab"
                        type="button"
                        th:each="cat : ${categories}"
                        th:attr="data-filter=${cat}"
                        th:text="${cat}">
                    Danh mục
                </button>
            </div>
        </aside>

        <div class="menu-main">
            <div class="filter-bar">
                <div class="filters">
                    <label class="sr-only" for="q">
                        Tìm món
                    </label>

                    <input id="q"
                           class="grow search-input"
                           type="search"
                           placeholder="Tìm món, ví dụ: salad, cá hồi…" />

                    <label class="sr-only" for="sort">
                        Sắp xếp
                    </label>

                    <select id="sort" class="sort-select">
                        <option value="">Nổi bật</option>
                        <option value="price_asc">
                            Giá thấp → cao
                        </option>
                        <option value="price_desc">
                            Giá cao → thấp
                        </option>
                    </select>
                </div>
            </div>

            <p class="result-count"
               aria-live="polite"
               id="resultCount"
               th:text="${#lists.size(products)} + ' món'">
                0 món
            </p>

            <!-- DANH SÁCH SẢN PHẨM LẤY TỪ DATABASE -->
            <div class="grid grid-4" id="menuGrid">

                <div th:each="p, stat : ${products}"
                     th:attr="
                        data-reveal=${(stat.index % 5) * 90},
                        data-cat=${p.categoryName},
                        data-name=${#strings.toLowerCase(p.name)},
                        data-price=${p.price}">

                    <article class="card p-card">

                        <!-- CLICK ẢNH ĐỂ XEM ĐÚNG MÓN -->
                        <a class="thumb"
                           th:href="@{/product(id=${p.id})}"
                           tabindex="-1"
                           aria-hidden="true">

                            <img th:src="${p.imageUrl}"
                                 th:alt="${p.name}"
                                 loading="lazy"
                                 width="400"
                                 height="300"
                                 onerror="this.onerror=null;this.src='/images/hero-bowl.jpg'" />
                        </a>

                        <div class="body">
                            <div class="badges">
                                <span class="badge"
                                      th:text="${p.categoryName}">
                                    Danh mục
                                </span>
                            </div>

                            <!-- CLICK TÊN ĐỂ XEM ĐÚNG MÓN -->
                            <h3>
                                <a th:href="@{/product(id=${p.id})}"
                                   th:text="${p.name}">
                                    Tên món
                                </a>
                            </h3>

                            <p class="desc"
                               th:text="${p.description}">
                                Mô tả món ăn
                            </p>

                            <div class="foot">
                                <span class="price"
                                      th:text="${p.priceLabel}">
                                    0đ
                                </span>

                                <button class="btn sm"
                                        type="button"
                                        th:data-id="${p.id}"
                                        th:data-name="${p.name}"
                                        th:data-price="${p.price}"
                                        onclick="openQuickAddModal(this)">
                                    Thêm vào giỏ
                                </button>
                            </div>
                        </div>
                    </article>
                </div>
            </div>

            <p class="muted"
               id="menuEmpty"
               th:hidden="${!#lists.isEmpty(products)}">
                Không tìm thấy món phù hợp.
            </p>
        </div>
    </div>
</main>

<!-- HỘP THOẠI POPUP CHỌN SỐ LƯỢNG & TỰ TÍNH TIỀN -->
<div id="quickAddModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 99999;">
    <div class="modal-content-box" style="background: #fff; width: 360px; max-width: 90%; border-radius: 12px; padding: 24px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); font-family: inherit;">
        <h3 id="modalName" style="margin-bottom: 6px; color: #2c3e50; font-size: 1.25rem;">Tên Món</h3>
        <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 16px;">Đơn giá: <strong id="modalUnitPriceDisplay">0</strong> đ</p>

        <form th:action="@{/cart/add}" method="post">
            <input type="hidden" name="productId" id="modalProductId" />

            <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0;">
                <button type="button" onclick="modifyQty(-1)" style="width: 38px; height: 38px; font-size: 20px; font-weight: bold; background: #f1f2f6; border: 1px solid #ced6e0; border-radius: 6px; cursor: pointer;">-</button>
                <input type="number" id="modalQtyInput" name="quantity" value="1" min="1" readonly style="width: 60px; height: 38px; text-align: center; font-size: 17px; font-weight: bold; border: 1px solid #ced6e0; border-radius: 6px; outline: none;" />
                <button type="button" onclick="modifyQty(1)" style="width: 38px; height: 38px; font-size: 20px; font-weight: bold; background: #f1f2f6; border: 1px solid #ced6e0; border-radius: 6px; cursor: pointer;">+</button>
            </div>

            <div style="font-size: 16px; margin: 16px 0;">
                Tổng tiền: <strong id="modalTotalDisplay" style="color: #27ae60; font-size: 22px;">0</strong> <strong style="color: #27ae60;">đ</strong>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button type="button" onclick="closeQuickAddModal()" style="background: #f1f2f6; border: 1px solid #ced6e0; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-weight: 500;">Hủy</button>
                <button type="submit" style="background: #27ae60; color: #fff; border: none; padding: 9px 20px; border-radius: 6px; font-weight: 600; cursor: pointer;">Thêm vào giỏ</button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{v2/fragments/layout :: footer}"></footer>
<th:block th:replace="~{v2/fragments/layout :: scripts}"></th:block>

<script>
    let selectedProductPrice = 0;

    function openQuickAddModal(button) {
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');
        const price = parseFloat(button.getAttribute('data-price')) || 0;

        selectedProductPrice = price;

        document.getElementById('modalProductId').value = id;
        document.getElementById('modalName').innerText = name;
        document.getElementById('modalUnitPriceDisplay').innerText = price.toLocaleString('vi-VN');
        document.getElementById('modalQtyInput').value = 1;

        calculateModalTotal();
        document.getElementById('quickAddModal').style.display = 'flex';
    }

    function closeQuickAddModal() {
        document.getElementById('quickAddModal').style.display = 'none';
    }

    function modifyQty(amount) {
        const qtyInput = document.getElementById('modalQtyInput');
        if (!qtyInput) return;
        let current = parseInt(qtyInput.value) || 1;
        current += amount;
        if (current < 1) current = 1;
        qtyInput.value = current;
        calculateModalTotal();
    }

    function calculateModalTotal() {
        const qtyInput = document.getElementById('modalQtyInput');
        const totalDisplay = document.getElementById('modalTotalDisplay');
        if (!qtyInput || !totalDisplay) return;

        const qty = parseInt(qtyInput.value) || 1;
        const total = selectedProductPrice * qty;
        totalDisplay.innerText = total.toLocaleString('vi-VN');
    }

    window.addEventListener('click', function(event) {
        const modal = document.getElementById('quickAddModal');
        if (event.target === modal) {
            closeQuickAddModal();
        }
    });

    // Tự động ẩn Toast sau 3 giây
    setTimeout(() => {
        const toast = document.getElementById('toastSuccess');
        if (toast) {
            toast.style.transition = 'opacity 0.5s ease';
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 500);
        }
    }, 3000);
</script>

<style>
@keyframes slideIn {
    from { transform: translateX(50px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
</style>

</body>
</html>
