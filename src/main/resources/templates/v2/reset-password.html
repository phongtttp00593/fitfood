<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{v2/fragments/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<div th:replace="~{v2/fragments/layout :: header('login')}"></div>

<main id="main">
  <div class="auth-wrap">
    <div class="container auth-container">
      <div class="card pad stack auth-card">
        <span class="auth-seal" aria-hidden="true"></span>
        <p class="eyebrow">Bảo mật tài khoản</p>
        <h1>Đặt lại mật khẩu</h1>
        <div class="msg error" th:unless="${validToken}">
          Liên kết không hợp lệ hoặc đã hết hạn. <a th:href="@{/quen-mat-khau}">Yêu cầu liên kết mới.</a>
        </div>
        <div class="msg error" th:if="${error}" th:text="${error}">Lỗi</div>
        <form class="stack" th:if="${validToken}" th:action="@{/dat-lai-mat-khau}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <input type="hidden" name="token" th:value="${token}" />
          <div class="field"><label for="p1">Mật khẩu mới</label><input id="p1" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="64" required /></div>
          <div class="field"><label for="p2">Xác nhận mật khẩu</label><input id="p2" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="64" required /></div>
          <button class="btn block" type="submit">Đổi mật khẩu</button>
        </form>
        <p class="small"><a th:href="@{/dang-nhap}">← Quay lại đăng nhập</a></p>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{v2/fragments/layout :: footer}"></footer>
<th:block th:replace="~{v2/fragments/layout :: scripts}"></th:block>
</body>
</html>
