<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{v2/fragments/layout :: head('Đăng nhập')}"></head>
<body>
<div th:replace="~{v2/fragments/layout :: header('login')}"></div>

<main id="main">
  <div class="auth-wrap">
    <div class="container auth-container">
      <div class="card pad stack auth-card">
        <span class="auth-seal" aria-hidden="true"></span>
        <p class="eyebrow">Chào mừng trở lại</p>
        <h1>Đăng nhập</h1>
        <div class="msg error" th:if="${param.error}">Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.</div>
        <div class="msg ok" th:if="${param.logout}">Bạn đã đăng xuất.</div>
        <div class="msg ok" th:if="${param.registered}">Đăng ký thành công! Hãy đăng nhập.</div>
        <div class="msg ok" th:if="${param.reset}">Đổi mật khẩu thành công! Hãy đăng nhập.</div>
        <form class="stack" th:action="@{/dang-nhap}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="field"><label for="l-email">Email</label><input id="l-email" name="email" type="email" autocomplete="username" required /></div>
          <div class="field"><label for="l-password">Mật khẩu</label><input id="l-password" name="password" type="password" autocomplete="current-password" required /></div>
          <button class="btn block" type="submit">Đăng nhập</button>
        </form>
        <p class="small">Chưa có tài khoản? <a th:href="@{/dang-ky}">Tạo tài khoản</a></p>
        <p class="small"><a th:href="@{/quen-mat-khau}">Quên mật khẩu?</a></p>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{v2/fragments/layout :: footer}"></footer>
<th:block th:replace="~{v2/fragments/layout :: scripts}"></th:block>
</body>
</html>
