<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{v2/fragments/layout :: head('Tài khoản')}"></head>
<body>
<div th:replace="~{v2/fragments/layout :: header('account')}"></div>

<main id="main">
  <header class="page-hero compact-title">
    <div class="container">
      <nav class="breadcrumb" aria-label="Đường dẫn"><a th:href="@{/}">Trang chủ</a> <i>›</i> <span aria-current="page">Tài khoản</span></nav>
      <p class="eyebrow">FITFOOD member</p>
      <h1>Thông tin tài khoản</h1>
    </div>
  </header>
  <div class="container" style="padding-bottom: 48px" th:if="${accountInfo != null}">
    <div class="card pad stack" data-reveal="0">
      <h2 class="card-title">Hồ sơ cá nhân</h2>
      <dl class="kv">
        <dt>Họ và tên</dt><dd th:text="${accountInfo.fullName}">Họ tên</dd>
        <dt>Email</dt><dd th:text="${accountInfo.email}">email@example.com</dd>
        <dt>Loại tài khoản</dt><dd th:text="${accountInfo.role}">Khách hàng</dd>
        <dt>Ngày tham gia</dt><dd th:text="${accountInfo.joinedDate}">09/10/2026</dd>
      </dl>
      <div class="row">
        <a class="btn" th:href="@{/menu}">Xem thực đơn →</a>
        <a class="btn outline" th:if="${isAdmin}" th:href="@{/admin}">Trang quản trị →</a>
        <a class="btn ghost" th:href="@{/quen-mat-khau}">Đặt lại mật khẩu qua email</a>
        <form th:action="@{/dang-xuat}" method="post" style="margin:0">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button class="btn ghost" type="submit">Đăng xuất</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{v2/fragments/layout :: footer}"></footer>
<th:block th:replace="~{v2/fragments/layout :: scripts}"></th:block>
</body>
</html>
