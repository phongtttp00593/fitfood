<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product.name})}"></head>
<body>

<div th:replace="~{fragments/layout :: header('menu')}"></div>

<main id="main">

    <!-- Token dùng cho các yêu cầu POST từ trang chi tiết món ăn (product-detail.js đọc các meta này). -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />

    <div class="container pdp">

        <nav class="pdp-crumbs" aria-label="Đường dẫn">
            <a th:href="@{/}">Trang chủ</a>
            <span aria-hidden="true">/</span>
            <a th:href="@{/menu}">Thực đơn</a>
            <span aria-hidden="true">/</span>
            <span aria-current="page" th:text="${product.name}">Tên món</span>
        </nav>

        <div class="pdp-grid">

            <!-- HÌNH ẢNH MÓN -->
            <figure class="photo framed pdp-photo">
                <img th:src="${product.imageUrl}"
                     th:alt="${product.name}"
                     width="900" height="720"
                     fetchpriority="high"
                     onerror="this.onerror=null;this.src='/images/hero-bowl.jpg'" />
            </figure>

            <!-- THÔNG TIN MÓN (LẤY TỪ DATABASE) -->
            <div class="pdp-info">

                <span class="badge" th:text="${product.categoryName}">Danh mục</span>

                <h1 th:text="${product.name}">Tên món</h1>

                <p class="pdp-price" id="displayBasePrice" th:text="${product.priceLabel}">0đ</p>

                <p class="pdp-desc" th:text="${product.description}">Mô tả món ăn</p>

                <ul class="pdp-perks">
                    <li>Nguyên liệu tươi, nấu mới mỗi ngày</li>
                    <li>Giao tận nơi, thanh toán khi nhận</li>
                </ul>

                <!-- BIẾN THỂ THEO TỪNG MÓN (product-detail.js dựng nội dung vào #userVariantBody) -->
                <div id="dynamicVariantsContainer" class="pdp-box">
                    <h2 class="pdp-box-title">Tùy chọn khẩu phần</h2>
                    <div id="userVariantBody"></div>
                </div>

                <!-- GHI CHÚ CHO BẾP -->
                <div class="pdp-field">
                    <label for="userFoodNote">Ghi chú cho bếp</label>
                    <input type="text"
                           id="userFoodNote"
                           name="foodNote"
                           accept-charset="UTF-8"
                           maxlength="200"
                           placeholder="Ví dụ: ít sốt, để riêng rau…" />
                </div>

                <!-- Form Thymeleaf cấp CSRF token và URL đúng cho nút Thêm vào giỏ. -->
                <form id="addToCartForm"
                      th:action="@{/cart/add}"
                      method="post"
                      accept-charset="UTF-8"
                      hidden>
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />
                    <input type="hidden" name="productId" th:value="${product.id}" />
                    <input type="hidden" id="cartQuantity" name="quantity" value="1" />
                    <input type="hidden" id="cartFoodNote" name="foodNote" value="" />
                    <input type="hidden" id="cartVariantName" name="variantName" value="" />
                </form>

                <!-- SỐ LƯỢNG + THÊM VÀO GIỎ -->
                <div class="pdp-buy">
                    <div class="pdp-qty" role="group" aria-label="Số lượng">
                        <button type="button" onclick="changeQty(-1)" aria-label="Giảm số lượng">−</button>
                        <span id="modalQty" aria-live="polite">1</span>
                        <button type="button" onclick="changeQty(1)" aria-label="Tăng số lượng">+</button>
                    </div>

                    <button type="button"
                            class="btn pdp-add"
                            onclick="addToCartWithVariants()">
                        Thêm vào giỏ ·
                        <span id="modalTotalPrice" th:text="${product.priceLabel}">0đ</span>
                    </button>
                </div>

                <p class="pdp-hint">Giao hàng tận nơi · Làm mới mỗi ngày</p>
            </div>
        </div>

        <!-- MÓN CÙNG DANH MỤC (dữ liệu relatedProducts do controller cấp) -->
        <section class="pdp-related" th:if="${relatedProducts != null and !#lists.isEmpty(relatedProducts)}">
            <h2>Món cùng danh mục</h2>

            <div class="grid grid-4">
                <article class="card p-card" th:each="r : ${relatedProducts}">
                    <a class="thumb" th:href="@{/product(id=${r.id})}" tabindex="-1" aria-hidden="true">
                        <img th:src="${r.imageUrl != null and !#strings.isEmpty(r.imageUrl)} ? ${r.imageUrl} : '/images/hero-bowl.jpg'"
                             th:alt="${r.name}"
                             loading="lazy"
                             width="400" height="300"
                             onerror="this.onerror=null;this.src='/images/hero-bowl.jpg'" />
                    </a>

                    <div class="body">
                        <h3>
                            <a th:href="@{/product(id=${r.id})}" th:text="${r.name}">Tên món</a>
                        </h3>

                        <div class="foot">
                            <span class="price"
                                  th:text="${#numbers.formatDecimal(r.price, 0, 'POINT', 0, 'COMMA')} + 'đ'">0đ</span>
                            <a class="btn sm" th:href="@{/product(id=${r.id})}">Xem món</a>
                        </div>
                    </div>
                </article>
            </div>
        </section>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<!-- TRUYỀN DỮ LIỆU MÓN TỪ DATABASE SANG JS -->
<script th:inline="javascript">
    window.fitfoodProduct = {
        id: /*[[${product.id}]]*/ 0,
        basePrice: /*[[${product.price}]]*/ 0,
        groups: /*[[${variantGroups}]]*/ []
    };
</script>

<script>
    let currentQty = 1;

    function changeQty(amount) {
        currentQty = Math.max(1, currentQty + amount);
        const modalQty = document.getElementById('modalQty');
        if (modalQty) modalQty.textContent = currentQty;
        if (typeof updateTotalPrice === 'function') {
            updateTotalPrice();
        }
    }

    function addToCartWithVariants() {
        const form = document.getElementById('addToCartForm');
        if (!form) return;

        // Cập nhật số lượng và ghi chú
        const qtyInput = document.getElementById('cartQuantity');
        if (qtyInput) qtyInput.value = currentQty;

        const foodNoteInput = document.getElementById('userFoodNote');
        const formNote = document.getElementById('cartFoodNote');
        if (foodNoteInput && formNote) {
            formNote.value = foodNoteInput.value;
        }

        // Tự động gom tên biến thể / lựa chọn đang được chọn
        const selectedLabels = [];
        const checkedRadios = document.querySelectorAll('#userVariantBody input[type="radio"]:checked, #userVariantBody input[type="checkbox"]:checked');
        checkedRadios.forEach(input => {
            let labelText = '';
            if (input.nextElementSibling) {
                labelText = input.nextElementSibling.textContent.trim();
            } else if (input.parentElement) {
                labelText = input.parentElement.textContent.trim();
            }
            if (labelText) {
                // Loại bỏ phần giá tiền trong ngoặc nếu có (+10.000đ)
                labelText = labelText.replace(/\s*\([^\)]*\)/g, '').trim();
                selectedLabels.push(labelText);
            } else if (input.value) {
                selectedLabels.push(input.value);
            }
        });

        const variantNameInput = document.getElementById('cartVariantName');
        if (variantNameInput) {
            variantNameInput.value = selectedLabels.join(', ');
        }

        form.submit();
    }
</script>

<script defer th:src="@{/js/product-detail.js}"></script>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
