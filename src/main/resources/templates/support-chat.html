
<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1" />

    <title>
        Chat hỗ trợ | FITFOOD
    </title>

    <link rel="stylesheet"
          th:href="@{/css/fitfood-modern.css}" />

    <link rel="stylesheet"
          th:href="@{/css/site-theme.css}" />

    <link rel="stylesheet"
          th:href="@{/css/support-chat.css}" />
</head>

<body>

<!-- HEADER -->
<header class="site-header">

    <div class="nav-inner">

        <a class="site-brand"
           th:href="@{/}">

            <img th:src="@{/images/leaf.svg}"
                 alt="" />

            <span>FITFOOD</span>
        </a>

        <nav class="nav-menu">

            <a th:href="@{/}">
                Trang chủ
            </a>

            <a th:href="@{/menu}">
                Thực đơn
            </a>

            <a th:href="@{/tai-khoan}">
                Tài khoản
            </a>

        </nav>
    </div>
</header>

<!-- TRANG CHAT -->
<main class="ff-chat-page-wrap">

    <div class="ff-chat-container">

        <div class="ff-chat-page-heading">

            <a th:href="@{/tai-khoan}">
                ← Quay lại tài khoản
            </a>

            <h1>
                Chat hỗ trợ FITFOOD
            </h1>

            <p>
                Gửi câu hỏi hoặc yêu cầu hỗ trợ.
                Tin nhắn sẽ được lưu lại trong
                tài khoản của bạn.
            </p>
        </div>

        <section class="ff-chat-screen"
                 data-support-chat
                 data-mode="page"
                 th:attr="
                    data-csrf=${_csrf.token},
                    data-csrf-header=${_csrf.headerName}">

            <!-- TIEU DE CHAT -->
            <div class="ff-chat-screen-top">

                <div class="ff-chat-brand-icon">
                    ✉
                </div>

                <div>
                    <h2>
                        Trò chuyện với FITFOOD
                    </h2>

                    <p data-chat-status
                       role="status">
                        Đang kết nối…
                    </p>
                </div>

                <button type="button"
                        class="ff-chat-refresh"
                        data-chat-refresh>

                    ↻ Làm mới
                </button>
            </div>

            <!-- LICH SU TIN NHAN -->
            <div class="ff-chat-messages"
                 data-chat-messages
                 role="log"
                 aria-live="polite"
                 aria-label="Nội dung cuộc trò chuyện">
            </div>

            <!-- FORM GUI TIN -->
            <form class="ff-chat-form"
                  data-chat-form>

                <label class="ff-chat-sr"
                       for="ffChatPageInput">

                    Nội dung tin nhắn
                </label>

                <textarea id="ffChatPageInput"
                          data-chat-input
                          maxlength="1000"
                          rows="2"
                          placeholder="Hãy mô tả điều bạn cần hỗ trợ…"
                          required>
                </textarea>

                <button type="submit"
                        data-chat-send>

                    Gửi tin nhắn
                </button>
            </form>

            <!-- THONG BAO LOI -->
            <p class="ff-chat-error"
               data-chat-error
               role="alert"
               hidden>
            </p>

            <p class="ff-chat-note">
                Bạn có thể quay lại trang này
                để xem lịch sử và phản hồi mới.
            </p>

        </section>
    </div>
</main>

<script defer
        th:src="@{/js/support-chat.js}">
</script>

</body>
</html>
