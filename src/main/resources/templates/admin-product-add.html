<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thêm món ăn mới | FITFOOD Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" th:href="@{/css/admin-product-add.css}" />
</head>
<body>

<div class="container">
    <div th:if="${successMessage}" class="message success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="message error" th:text="${errorMessage}"></div>

    <form th:action="@{/admin/products/add}"
          th:object="${productForm}"
          method="post"
          enctype="multipart/form-data">

        <label for="name">Tên sản phẩm (*)</label>
        <input type="text" id="name" th:field="*{name}" required placeholder="Ví dụ: Cơm gà sốt tiêu đen" />
        <div class="message error" style="margin-top:4px;" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

        <label for="categoryId">Danh mục (*)</label>
        <select id="categoryId" th:field="*{categoryId}" required>
            <option value="">-- Chọn danh mục --</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
        </select>
        <div class="message error" style="margin-top:4px;" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>

        <label for="price">Giá bán (VNĐ) (*)</label>
        <input type="number" id="price" th:field="*{price}" step="1000" min="0" required placeholder="Ví dụ: 65000" />
        <div class="message error" style="margin-top:4px;" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>

        <label for="stock">Số lượng hiện có (*)</label>
        <input type="number" id="stock" th:field="*{stock}" min="0" required placeholder="Ví dụ: 50" />
        <div class="message error" style="margin-top:4px;" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>

        <label for="description">Mô tả món ăn</label>
        <textarea id="description" th:field="*{description}" placeholder="Mô tả thành phần, calo..."></textarea>

        <label for="imageFile">Hình ảnh món ăn</label>
        <input type="file" id="imageFile" th:field="*{imageFile}" accept="image/*" onchange="previewImage(this)" />
        <img id="preview" alt="Xem trước hình ảnh" />

        <div class="active-row">
            <input type="checkbox" id="active" th:field="*{active}" />
            <label for="active">Đang mở bán trên thực đơn</label>
        </div>

        <div class="actions">
            <button type="button" class="btn cancel" onclick="closeModal()">Hủy bỏ</button>
            <button type="submit" class="btn save">Lưu món ăn</button>
        </div>
    </form>
</div>

<script th:inline="javascript">
    function previewImage(input) {
        const preview = document.getElementById('preview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.style.display = 'none';
        }
    }

    function closeModal() {
        if (window.parent) {
            window.parent.postMessage({ type: 'FITFOOD_CLOSE_MODAL' }, window.location.origin);
        }
    }

    /*<![CDATA[*/
    var addedSuccess = /*[[${successMessage != null}]]*/ false;
    if (addedSuccess && window.parent) {
        window.parent.postMessage({ type: 'FITFOOD_PRODUCT_ADDED' }, window.location.origin);
    }
    /*]]>*/
</script>

</body>
</html>
