<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - FitFood</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/fitfood-modern.css}">
    <style>
        .cart-wrapper {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 15px;
        }
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-top: 20px;
        }
        .cart-table th, .cart-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        .cart-table th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: 600;
        }
        .qty-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-qty-action {
            width: 28px;
            height: 28px;
            background: #f1f2f6;
            border: 1px solid #ced6e0;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-qty-action:hover {
            background: #dfe4ea;
        }
        .btn-remove {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-remove:hover {
            background-color: #c0392b;
        }
        .empty-alert {
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header style="background: #2c3e50; color: #fff; padding: 15px 0;">
        <div style="max-width: 1000px; margin: auto; display: flex; justify-content: space-between; align-items: center; padding: 0 15px;">
            <a th:href="@{/}" style="color: #fff; text-decoration: none; font-size: 22px; font-weight: bold;">FitFood</a>
            <nav style="display: flex; gap: 20px; align-items: center;">
                <a th:href="@{/menu}" style="color: #fff; text-decoration: none;">Thực Đơn</a>
                <a th:href="@{/cart}" style="color: #fff; text-decoration: none; font-weight: bold;">Giỏ hàng</a>
            </nav>
        </div>
    </header>

    <div class="cart-wrapper">
        <h2>Giỏ Hàng Của Bạn</h2>

        <!-- Khi giỏ hàng có sản phẩm -->
        <div th:if="${cart != null and cart.items != null and !cart.items.isEmpty()}">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Món ăn</th>
                        <th>Đơn giá</th>
                        <th style="text-align: center;">Số lượng</th>
                        <th>Thành tiền</th>
                        <th style="text-align: center;">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cart.items}">
                        <td style="font-weight: 500;" th:text="${item.product.name}">Tên Món</td>
                        <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td>
                        
                        <!-- Cột tăng giảm số lượng -->
                        <td style="text-align: center;">
                            <div class="qty-box">
                                <form th:action="@{/cart/update-quantity}" method="post" style="margin: 0;">
                                    <input type="hidden" name="itemId" th:value="${item.id}" />
                                    <input type="hidden" name="change" value="-1" />
                                    <button type="submit" class="btn-qty-action">-</button>
                                </form>

                                <span style="font-weight: bold; min-width: 24px; display: inline-block;" th:text="${item.quantity}">1</span>

                                <form th:action="@{/cart/update-quantity}" method="post" style="margin: 0;">
                                    <input type="hidden" name="itemId" th:value="${item.id}" />
                                    <input type="hidden" name="change" value="1" />
                                    <button type="submit" class="btn-qty-action">+</button>
                                </form>
                            </div>
                        </td>

                        <!-- Thành tiền -->
                        <td style="color: #27ae60; font-weight: bold;"
                            th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td>

                        <!-- Cột Xóa -->
                        <td style="text-align: center;">
                            <form th:action="@{/cart/remove}" method="post" onsubmit="return confirm('Bạn có muốn xóa món này không?');" style="margin: 0;">
                                <input type="hidden" name="itemId" th:value="${item.id}" />
                                <button type="submit" class="btn-remove">Xóa</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Tổng tiền thanh toán -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px;">
                <a th:href="@{/menu}" style="color: #3498db; text-decoration: none; font-weight: 500;">← Tiếp tục chọn món</a>
                <div style="font-size: 18px;">
                    Tổng cộng: <strong style="color: #e74c3c; font-size: 24px;" th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</strong>
                </div>
            </div>
        </div>

        <!-- Khi giỏ hàng trống -->
        <div th:if="${cart == null or cart.items == null or cart.items.isEmpty()}" class="empty-alert">
            <p style="color: #7f8c8d; font-size: 16px; margin-bottom: 16px;">Giỏ hàng của bạn đang trống.</p>
            <a th:href="@{/menu}" style="background: #27ae60; color: #fff; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600;">Xem Thực Đơn</a>
        </div>
    </div>

</body>
</html>
