<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cập nhật món ăn | FITFOOD Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" th:href="@{/css/admin-product-edit.css}" />
</head>
<body>

<div class="container">

    <div th:if="${successMessage}"
         class="message success"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}"
         class="message error"
         th:text="${errorMessage}"></div>

    <form th:action="@{/admin/products/edit/{id}(id=${productId})}"
          th:object="${productForm}"
          method="post"
          enctype="multipart/form-data">

        <label for="name">Tên sản phẩm (*)</label>
        <input type="text"
               id="name"
               th:field="*{name}"
               required
               placeholder="Ví dụ: Cơm gà sốt tiêu đen" />

        <div class="message error"
             style="margin-top:4px;"
             th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}"></div>

        <label for="categoryId">Danh mục (*)</label>
        <select id="categoryId" th:field="*{categoryId}" required>
            <option value="">-- Chọn danh mục --</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"></option>
        </select>

        <div class="message error"
             style="margin-top:4px;"
             th:if="${#fields.hasErrors('categoryId')}"
             th:errors="*{categoryId}"></div>

        <label for="price">Giá bán (VNĐ) (*)</label>
        <input type="number"
               id="price"
               th:field="*{price}"
               step="1000"
               min="0"
               required
               placeholder="Ví dụ: 65000" />

        <div class="message error"
             style="margin-top:4px;"
             th:if="${#fields.hasErrors('price')}"
             th:errors="*{price}"></div>

        <label for="stock">Số lượng hiện có (*)</label>
        <input type="number"
               id="stock"
               th:field="*{stock}"
               min="0"
               required
               placeholder="Ví dụ: 50" />

        <div class="message error"
             style="margin-top:4px;"
             th:if="${#fields.hasErrors('stock')}"
             th:errors="*{stock}"></div>

        <label for="description">Mô tả món ăn</label>
        <textarea id="description"
                  th:field="*{description}"
                  placeholder="Mô tả thành phần, calo..."></textarea>

        <label>Hình ảnh hiện tại</label>
        <div class="current-image-box">
            <img th:if="${currentImageUrl != null and !#strings.isEmpty(currentImageUrl)}"
                 th:src="${currentImageUrl}"
                 alt="Ảnh món ăn hiện tại"
                 class="current-img" />
            <span th:if="${currentImageUrl == null or #strings.isEmpty(currentImageUrl)}"
                  class="no-img-text">Chưa có hình ảnh</span>
        </div>

        <label for="imageFile">Đổi hình ảnh món ăn (nếu cần)</label>
        <input type="file"
               id="imageFile"
               th:field="*{imageFile}"
               accept="image/*"
               onchange="previewImage(this)" />

        <img id="preview" alt="Xem trước hình ảnh mới" />

        <div class="active-row">
            <input type="checkbox"
                   id="active"
                   th:field="*{active}" />
            <label for="active">Đang mở bán trên thực đơn</label>
        </div>

        <div class="actions">
            <a class="btn cancel"
               th:href="@{/admin/products}">
                Hủy bỏ
            </a>

            <button type="submit" class="btn save">
                Cập nhật món ăn
            </button>
        </div>

    </form>
</div>

<script>
    function previewImage(input) {
        const preview = document.getElementById('preview');

        if (input.files && input.files[0]) {
            const reader = new FileReader();

            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };

            reader.readAsDataURL(input.files[0]);
        } else {
            preview.style.display = 'none';
        }
    }
</script>

</body>
</html>
