spring.application.name=FITFOOD

# ===============================
# SQL SERVER
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FITFOOD;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12341234

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# SERVER
# ===============================
server.port=8080


# ==================================
# FITFOOD - EMAIL QUEN MAT KHAU
# ==================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${FITFOOD_MAIL_USERNAME:}
spring.mail.password=${FITFOOD_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Website FITFOOD
fitfood.base-url=http://localhost:8080

# Tai khoan Admin
fitfood.bootstrap.admin-email=${FITFOOD_ADMIN_EMAIL:}
fitfood.bootstrap.admin-password=${FITFOOD_ADMIN_PASSWORD:}
